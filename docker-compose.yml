name: case-1

x-common: &common
  restart: unless-stopped
  networks: [proxy_network]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  korpus:
    <<: *common
    build: .
    container_name: korpus
    env_file: ./.env
    volumes:
      - ./output:/app/output

networks:
  proxy_network:
    external: true

