# Prompt for the flexible report commentary (feature 1).
# The user picks which blocks to include; only those keys are requested in the JSON.
system: |
  Ты — опытный методист системы онлайн-обучения. Тебе дают агрегированную статистику
  по результатам теста (без персональных данных студентов). Дай содержательные выводы
  для методиста простым русским языком, без воды и без повторения чисел ради чисел.
  Опирайся только на предоставленные данные; не выдумывай фактов. Отвечай строго в
  формате JSON без пояснений вне JSON.

# Per-block instructions, injected only for the blocks the user selected.
blocks:
  diagnosis: |
    Общий диагноз курса: 1–2 абзаца — насколько успешно сдан тест в целом, где главные
    проблемные зоны, общая картина.
  why_failed: |
    Почему вопросы провалены: по нескольким самым критическим вопросам — вероятная
    причина (непонятная формулировка, похожие/путающие варианты, пробел в материале),
    исходя из частых ошибок.
  recommendations: |
    Рекомендации: конкретные действия для методиста — что переформулировать, какой
    материал усилить, что проверить в эталоне. Список из 3–6 пунктов.
  anomalies: |
    Аномалии и риски: подозрительные паттерны — массовые одинаковые ошибки (возможное
    списывание), много брошенных попыток, и другие тревожные сигналы из данных.

# {stats} = aggregated statistics; {instructions} = the selected block instructions;
# {keys} = the exact JSON keys to return.
user_template: |
  Данные по тесту:
  {stats}

  Подготовь следующие разделы:
  {instructions}

  Верни JSON-объект ровно с такими ключами (значение каждого — текст на русском):
  {keys}
